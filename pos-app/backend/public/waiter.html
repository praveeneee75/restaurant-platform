<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f766e">
  <title>POS Dine In</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/waiter.css">
</head>
<body>
  <header class="waiter-top">
    <div>
      <h1>POS Dine In</h1>
      <p id="waiterStatus">Loading...</p>
    </div>
    <div class="waiter-header-actions"><button id="refreshWaiter" type="button">Refresh</button><button id="logoutWaiter" type="button">Logout</button></div>
  </header>

  <nav class="mobile-order-nav" aria-label="Dine In steps">
    <button type="button" class="active" data-waiter-step="tables">1. Tables</button>
    <button type="button" data-waiter-step="menu">2. Menu</button>
    <button type="button" data-waiter-step="order">3. Order <span id="mobileCartCount">0</span></button>
  </nav>

  <main class="waiter-layout">
    <section class="panel" data-waiter-panel="tables">
      <h2>Tables</h2>
      <div id="waiterTables" class="table-grid"></div>
    </section>

    <section class="panel" data-waiter-panel="menu">
      <h2 id="selectedTableTitle">Select a table</h2>
      <div id="waiterCategories" class="category-strip"></div>
      <div id="waiterItems" class="item-list"></div>
    </section>

    <section class="panel cart-panel" data-waiter-panel="order">
      <h2>Order</h2>
      <p id="lockStatus">No table locked</p>
      <div class="check-controls">
        <label>Customer check<select id="waiterOrderSelector"><option value="">New customer check</option></select></label>
        <div class="check-actions"><button id="newWaiterCheck" type="button">New customer check</button><button id="parcelWaiterCheck" type="button">Parcel check</button></div>
      </div>
      <div class="customer-controls">
        <label>Customer phone<input id="waiterCustomerPhone" inputmode="tel" placeholder="Customer phone"></label>
        <button id="searchWaiterCustomer" type="button">Search</button>
        <label>Customer name<input id="waiterCustomerName" placeholder="Customer name"></label>
        <button id="createWaiterCustomer" type="button">Create customer</button>
        <p id="waiterCustomerStatus">No customer attached</p>
      </div>
      <p id="fulfilmentStatus" class="fulfilment-status">Dine In check</p>
      <div id="waiterCart" class="cart-list"></div>
      <strong id="waiterTotal">Total: 0.00</strong>
      <div class="transfer-panel">
        <label>Transfer to table
          <select id="transferTable"></select>
        </label>
        <button id="transferTableButton" type="button">Transfer Table</button>
      </div>
      <div class="actions">
        <button id="saveWaiterOrder" type="button">Save Order</button>
        <button id="submitWaiterKot" type="button">Submit KOT</button>
        <button id="finalWaiterCheck" type="button">Final Bill &amp; Print</button>
        <button id="unlockWaiterTable" type="button">Unlock</button>
      </div>
    </section>
  </main>

  <script src="/js/ui-feedback.js"></script>
  <script src="/js/waiter.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => undefined);
    }
  </script>
</body>
</html>
