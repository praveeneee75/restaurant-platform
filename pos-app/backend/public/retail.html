<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retail Counter</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/retail.css"><link rel="stylesheet" href="/css/retail-fixes.css"></head>
<body class="retail-shell">
<header class="retail-header"><div><span class="eyebrow">Snacks &amp; Confectionery</span><h1>Retail Counter</h1><p>Scan a barcode or search manually. Each repeat scan adds one unit.</p></div><nav><a href="/pos-live.html?mode=PARCEL">POS Parcel</a><a href="/billing.html">Billing</a><a href="/admin.html?view=items">Items</a><button data-logout type="button" class="danger-btn">Logout</button></nav></header>
<main class="retail-layout">
 <section class="retail-catalog card"><div class="retail-kpis"><span>Today sales <b id="retailTodaySales">INR 0.00</b></span><span>Transactions <b id="retailTransactions">0</b></span><span>Gross profit <b id="retailGrossProfit">INR 0.00</b></span><span>Low stock <b id="retailLowStock">0</b></span></div><label class="scan-field"><span>Barcode or item search</span><input id="retailSearch" autofocus autocomplete="off" placeholder="Scan barcode or type item name / code"><small>USB/Bluetooth keyboard-wedge scanners work without drivers.</small></label><div id="retailCategories" class="retail-categories"></div><div id="retailItems" class="retail-items"></div></section>
 <aside class="retail-basket card"><header><div><span class="eyebrow">Current sale</span><h2>Walk-in customer</h2></div><button id="clearRetailSale" class="secondary-btn" type="button">Clear</button></header><div id="retailBasket" class="retail-basket-lines"></div><div class="retail-totals"><span>Items <b id="retailQuantity">0</b></span><span>Total <b id="retailTotal">INR 0.00</b></span></div><label>Payment method<select id="retailPayment"><option value="CASH">Cash</option><option value="CARD">Card</option><option value="UPI">UPI</option></select></label><label class="print-choice"><input id="retailPrint" type="checkbox" checked> Print receipt</label><button id="completeRetailSale" class="primary-btn" type="button">Settle &amp; Invoice</button><p id="retailStatus" role="status" aria-live="polite"></p></aside>
</main><div id="retailToast" class="pos-toast" hidden></div><script src="/js/ui-feedback.js"></script><script src="/js/retail.js"></script></body></html>
